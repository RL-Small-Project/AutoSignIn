[project]
name = "autosignin"
version = "0.1.0"
description = "中國科技大學-自動化點名系統"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet[all]>=0.24.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "playwright>=1.55.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "selenium>=4.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
